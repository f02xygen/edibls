services:
  edibls:
    image: edibls:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: edibls
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - RUST_LOG=info
      - YOUTUBE_POT_URL=http://pot-provider:4416/get_pot
    tmpfs:
      - /tmp:size=512M,mode=1777
    # Uncomment if you want to mount cookies.txt for yt-dlp:
    # volumes:
    #   - ./cookies.txt:/app/cookies.txt:ro
    depends_on:
      pot-provider:
        condition: service_started

  pot-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    container_name: edibls-pot-provider
    restart: unless-stopped
    init: true
