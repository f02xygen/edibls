services:
  edibls:
    image: ghcr.io/f02xygen/edibls:latest
    container_name: edibls
    restart: unless-stopped
    network_mode: "service:telegram-bot-api"
    env_file:
      - .env
    environment:
      - RUST_LOG=info
      - YOUTUBE_POT_URL=http://pot-provider:4416/get_pot
      - TELEGRAM_API_URL=http://127.0.0.1:8081
      - SETTINGS_PATH=/app/data/settings.json
      - CACHE_PATH=/app/data/cache.json
    tmpfs:
      - /tmp:size=4096M,mode=1777
    volumes:
      - edibls-data:/app/data
      # Uncomment if you want to mount cookies.txt for yt-dlp:
      # - ./cookies.txt:/app/cookies.txt:ro
    depends_on:
      pot-provider:
        condition: service_started
      telegram-bot-api:
        condition: service_started

  pot-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    container_name: edibls-pot-provider
    restart: unless-stopped
    init: true

  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    container_name: edibls-telegram-bot-api
    restart: unless-stopped
    environment:
      - TELEGRAM_API_ID=${TELEGRAM_API_ID:-2040}
      - TELEGRAM_API_HASH=${TELEGRAM_API_HASH:-b18441a1ff607e10a989891a5462e627}
      - TELEGRAM_LOCAL=1
    volumes:
      - telegram-bot-api-data:/var/lib/telegram-bot-api

volumes:
  telegram-bot-api-data:
  edibls-data:

